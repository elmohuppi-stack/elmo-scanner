services:
  postgres:
    image: postgres:16-alpine
    container_name: elmo_scanner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rssreader
      POSTGRES_USER: rssreader
      POSTGRES_PASSWORD: rssreader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rssreader -d rssreader"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
